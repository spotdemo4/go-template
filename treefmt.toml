#:schema https://www.schemastore.org/treefmt.json

[formatter.golangci-lint]
command = "golangci-lint"
options = ["fmt"]
includes = ["*.go"]

[formatter.nixfmt]
command = "nixfmt"
includes = ["*.nix"]

[formatter.oxfmt]
command = "oxfmt"
options = ["--write"]
includes = ["*.json", "*.yaml", "*.toml", "*.md"]
